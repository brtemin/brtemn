<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Güzel Kızsın ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff4e50, #fc913a);
    overflow: hidden;
    font-family: 'Arial', sans-serif;
}

/* ARKA PLAN PARÇACIK */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: float 10s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    to {
        transform: translateY(-10vh);
        opacity: 1;
    }
}

/* ANA YAZI */
.text {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 60px;
    color: white;
    font-weight: bold;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 40px red; }
}

/* KALP */
.heart {
    position: absolute;
    width: 100px;
    height: 100px;
    background: red;
    transform: rotate(-45deg);
    top: 55%;
    left: 50%;
    margin-left: -50px;
    animation: beat 1s infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    background: red;
    border-radius: 50%;
}

.heart::before {
    top: -50px;
    left: 0;
}

.heart::after {
    left: 50px;
    top: 0;
}

@keyframes beat {
    0% { transform: scale(1) rotate(-45deg); }
    50% { transform: scale(1.2) rotate(-45deg); }
    100% { transform: scale(1) rotate(-45deg); }
}

/* ALT YAZI */
.sub {
    position: absolute;
    top: 75%;
    width: 100%;
    text-align: center;
    font-size: 24px;
    color: white;
    opacity: 0.8;
}

/* TIKLAMA EFEKTİ */
.click-heart {
    position: absolute;
    color: red;
    font-size: 20px;
    pointer-events: none;
    animation: rise 1s forwards;
}

@keyframes rise {
    from {
        opacity: 1;
        transform: translateY(0);
    }
    to {
        opacity: 0;
        transform: translateY(-100px);
    }
}
</style>
</head>

<body>

<div class="text">GÜZEL KIZSIN ❤️</div>
<div class="heart"></div>
<div class="sub">Tıklayınca kalpler çıkar 💖</div>

<script>

/* ARKA PLAN YILDIZLARI */
for (let i = 0; i < 80; i++) {
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(p);
}

/* TIKLAYINCA KALP ÇIKSIN */
document.addEventListener("click", function(e) {
    let heart = document.createElement("div");
    heart.className = "click-heart";
    heart.innerHTML = "❤️";

    heart.style.left = e.clientX + "px";
    heart.style.top = e.clientY + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 1000);
});

/* ARKA PLAN RENK DEĞİŞİM */
let colors = [
    "linear-gradient(135deg, #ff4e50, #fc913a)",
    "linear-gradient(135deg, #ff6a00, #ee0979)",
    "linear-gradient(135deg, #00c6ff, #0072ff)",
    "linear-gradient(135deg, #f7971e, #ffd200)"
];

let index = 0;

setInterval(() => {
    index = (index + 1) % colors.length;
    document.body.style.background = colors[index];
}, 4000);

/* RANDOM PARLAKLIK EFEKTİ */
setInterval(() => {
    document.querySelector(".text").style.opacity = Math.random() * 0.5 + 0.5;
}, 500);

/* KALP BOYUT RANDOM */
setInterval(() => {
    let heart = document.querySelector(".heart");
    let scale = 1 + Math.random() * 0.3;
    heart.style.transform = `scale(${scale}) rotate(-45deg)`;
}, 800);

/* EKSTRA PARTICLE */
setInterval(() => {
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(p);

    setTimeout(() => p.remove(), 10000);
}, 500);

/* ALT YAZI ANİMASYON */
let sub = document.querySelector(".sub");
let texts = [
    "Sen çok özelsin ✨",
    "Gülüşün efsane 😍",
    "Kalbin çok güzel ❤️",
    "Harikasın 💫"
];

let ti = 0;

setInterval(() => {
    ti = (ti + 1) % texts.length;
    sub.innerHTML = texts[ti];
}, 3000);

</script>

</body>
</html>
